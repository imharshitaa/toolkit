version: '3.8'

# ToolKit local lab stack. Every credential below is read from environment
# variables — copy .env.example to .env and set real values before running
# `docker compose up`. Nothing here is a real external SaaS account; every
# service is self-hosted and runs entirely on your machine.

services:
  # Splunk Enterprise — SOC module backend
  splunk:
    image: splunk/splunk:latest
    container_name: splunk-enterprise
    hostname: splunk
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD in your .env file}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN in your .env file}
    ports:
      - "8000:8000"   # Web UI
      - "8088:8088"   # HEC
      - "8089:8089"   # Management
      - "9997:9997"   # Receiver
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
    networks:
      - security-net
    restart: unless-stopped

  # OWASP ZAP — AppSec module backend
  zap:
    image: owasp/zap2docker-stable
    container_name: zap-scanner
    hostname: zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=false -config api.key=${ZAP_API_KEY:?Set ZAP_API_KEY in your .env file}
    ports:
      - "8080:8080"   # ZAP UI / API
      - "8090:8090"   # Proxy
    networks:
      - security-net
    restart: unless-stopped

  # Wazuh Manager — SOC/EDR module backend
  wazuh:
    image: wazuh/wazuh:latest
    container_name: wazuh-manager
    hostname: wazuh
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=${WAZUH_INDEXER_USERNAME:?Set WAZUH_INDEXER_USERNAME in your .env file}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?Set WAZUH_INDEXER_PASSWORD in your .env file}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
    ports:
      - "1514:1514"   # Agent registration
      - "1515:1515"   # Agent communication
      - "514:514/udp" # Syslog
      - "55000:55000" # API
    volumes:
      - wazuh-config:/wazuh-config-mount
      - wazuh-data:/var/ossec/data
    networks:
      - security-net
    restart: unless-stopped

  # Wazuh Indexer (OpenSearch)
  wazuh-indexer:
    image: wazuh/wazuh-indexer:latest
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    networks:
      - security-net
    restart: unless-stopped

  # Wazuh Dashboard
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:latest
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    environment:
      - INDEXER_USERNAME=${WAZUH_INDEXER_USERNAME:?Set WAZUH_INDEXER_USERNAME in your .env file}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?Set WAZUH_INDEXER_PASSWORD in your .env file}
      - WAZUH_API_URL=https://wazuh
      - API_USERNAME=${WAZUH_API_USERNAME:?Set WAZUH_API_USERNAME in your .env file}
      - API_PASSWORD=${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD in your .env file}
    ports:
      - "5601:5601"   # Dashboard UI
    depends_on:
      - wazuh-indexer
    networks:
      - security-net
    restart: unless-stopped

  # DVWA — intentionally vulnerable app used as a safe, local ZAP scan target
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    hostname: dvwa
    ports:
      - "8081:80"
    networks:
      - security-net
    restart: unless-stopped

volumes:
  splunk-etc:
  splunk-var:
  wazuh-config:
  wazuh-data:
  wazuh-indexer-data:

networks:
  security-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
