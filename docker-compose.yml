version: '3.8'

services:
  # Splunk Enterprise
  splunk:
    image: splunk/splunk:latest
    container_name: splunk-enterprise
    hostname: splunk
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=toolkit2024
      - SPLUNK_HEC_TOKEN=toolkit-hec-token
    ports:
      - "8000:8000"   # Web UI
      - "8088:8088"   # HEC
      - "8089:8089"   # Management
      - "9997:9997"   # Receiver
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
    networks:
      - security-net
    restart: unless-stopped

  # OWASP ZAP
  zap:
    image: owasp/zap2docker-stable
    container_name: zap-scanner
    hostname: zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=toolkit-zap-key
    ports:
      - "8080:8080"   # ZAP UI
      - "8090:8090"   # Proxy
    networks:
      - security-net
    restart: unless-stopped

  # Wazuh Manager
  wazuh:
    image: wazuh/wazuh:latest
    container_name: wazuh-manager
    hostname: wazuh
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
    ports:
      - "1514:1514"   # Agent registration
      - "1515:1515"   # Agent communication
      - "514:514/udp" # Syslog
      - "55000:55000" # API
    volumes:
      - wazuh-config:/wazuh-config-mount
      - wazuh-data:/var/ossec/data
    networks:
      - security-net
    restart: unless-stopped

  # Wazuh Indexer (OpenSearch)
  wazuh-indexer:
    image: wazuh/wazuh-indexer:latest
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    networks:
      - security-net
    restart: unless-stopped

  # Wazuh Dashboard
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:latest
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
      - WAZUH_API_URL=https://wazuh
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=wazuh-wui
    ports:
      - "5601:5601"   # Kibana/Dashboard
    depends_on:
      - wazuh-indexer
    networks:
      - security-net
    restart: unless-stopped

  # Elasticsearch (for ELK stack)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    networks:
      - security-net
    restart: unless-stopped

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    hostname: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5602:5601"
    depends_on:
      - elasticsearch
    networks:
      - security-net
    restart: unless-stopped

  # Vulnerable Web App for Testing (DVWA)
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    hostname: dvwa
    ports:
      - "8081:80"
    networks:
      - security-net
    restart: unless-stopped

  # Metasploitable (Vulnerable Target)
  metasploitable:
    image: tleemcjr/metasploitable2
    container_name: metasploitable
    hostname: metasploitable
    ports:
      - "2121:21"     # FTP
      - "2222:22"     # SSH
      - "2323:23"     # Telnet
      - "8082:80"     # HTTP
    networks:
      - security-net
    restart: unless-stopped

  # Portainer (Container Management)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - security-net
    restart: unless-stopped

volumes:
  splunk-etc:
  splunk-var:
  wazuh-config:
  wazuh-data:
  wazuh-indexer-data:
  elastic-data:
  portainer-data:

networks:
  security-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
